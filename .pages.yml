# Pages CMS configuration — https://pagescms.org/docs
#
# Content lives in content/*.json. A commit here triggers the GitHub Actions
# workflow, which runs scripts/build.mjs and redeploys the site.

media:
  - name: gallery
    label: Gallery photos
    input: images/gallery
    output: images/gallery
    extensions: [jpg, jpeg, png, webp]
  - name: logos
    label: Client logos
    input: assets/img
    output: assets/img
    extensions: [jpg, jpeg, png, svg, webp]
  - name: documents
    label: Documents
    input: assets/docs
    output: assets/docs
    extensions: [pdf]

content:
  - name: contact
    label: Contact details
    type: file
    path: content/contact.json
    format: json
    fields:
      - name: phone
        label: Phone number
        type: string
        description: As it should appear on the site, e.g. +222 48 15 63 30. The call link is generated from the digits.
        required: true
      - name: whatsapp
        label: WhatsApp number
        type: string
        description: Full international number, e.g. +222 48 15 63 30. Spaces and + are fine; the wa.me link keeps digits only.
        required: true
      - name: email
        label: Email address
        type: string
        description: Shown in the contact section and footer, and used by the booking form.
        required: true

  - name: gallery
    label: Gallery
    type: file
    path: content/gallery.json
    format: json
    fields:
      - name: photos
        label: Photos
        type: object
        list: true
        fields:
          - { name: image, label: Full-size image, type: image, options: { media: gallery } }
          - { name: thumbnail, label: Thumbnail, type: image, options: { media: gallery } }
          - { name: alt, label: Description (alt text), type: string }

  - name: clients
    label: Clients & partners
    type: file
    path: content/clients.json
    format: json
    fields:
      - name: logos
        label: Logos
        type: object
        list: true
        fields:
          - { name: logo, label: Logo image, type: image, options: { media: logos } }
          - { name: name, label: Client name, type: string }

